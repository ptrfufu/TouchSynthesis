name: Build TouchSynthesis connection diagnostics IPA

on:
  push:
    branches: [ci/connection-diagnostics, ci/ios16-legacy-runner]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install XcodeGen and build Rust FFI
        run: |
          xcodebuild -version
          brew install xcodegen
          bash scripts/build-idevice.sh
          xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          if ! xcodebuild -project TouchSynthesis.xcodeproj -scheme TouchSynthesis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
            python3 -c 'import sys; from pathlib import Path; lines = Path(sys.argv[1]).read_text(errors="replace").splitlines(); errors = [line.strip() for line in lines if "error:" in line]; print("\n".join("::error::" + line.replace("%", "%25") for line in (errors or lines[-20:])[:20]))' "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
      - name: Verify and package IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/TouchSynthesis.app"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$app/Info.plist")" = '_touchsynth._tcp'
          /usr/bin/strings "$app/TouchSynthesis" > "$RUNNER_TEMP/app-strings.txt"
          if [ "$GITHUB_REF_NAME" = ci/ios16-legacy-runner ]; then
            /usr/bin/grep -F 'Preparing the runner' "$RUNNER_TEMP/app-strings.txt"
          else
            /usr/bin/grep -F 'Probe Lockdown TCP' "$RUNNER_TEMP/app-strings.txt"
          fi
          mkdir -p "$RUNNER_TEMP/package/Payload" "$RUNNER_TEMP/artifacts"
          ditto "$app" "$RUNNER_TEMP/package/Payload/TouchSynthesis.app"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qr "$RUNNER_TEMP/artifacts/TouchSynthesis-connection-diagnostics-unsigned.ipa" Payload
          /usr/bin/unzip -tq "$RUNNER_TEMP/artifacts/TouchSynthesis-connection-diagnostics-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: TouchSynthesis-connection-diagnostics-unsigned
          path: ${{ runner.temp }}/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
