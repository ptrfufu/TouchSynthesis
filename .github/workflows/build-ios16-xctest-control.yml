name: Build iOS 16 XCTest control
on:
  push:
    branches: [ci/ios16-xctest-control]
    paths:
      - 'Diagnostics/XCTestControl/**'
      - '.github/workflows/build-ios16-xctest-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Diagnostics/XCTestControl
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build XCTest runner for iPhone
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          xcodebuild -project XCTestControl.xcodeproj -scheme XCTestControl \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Verify and package the runner
        run: |
          set -euo pipefail
          runner="$RUNNER_TEMP/derived/Build/Products/Debug-iphoneos/XCTestControlUITests-Runner.app"
          test -d "$runner/PlugIns/XCTestControlUITests.xctest"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$runner/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$runner/Info.plist"
          mkdir -p "$RUNNER_TEMP/package/Payload" "$RUNNER_TEMP/artifacts"
          stage="$RUNNER_TEMP/package/Payload/XCTestControlUITests-Runner.app"
          ditto "$runner" "$stage"
          python3 - "$stage" <<'PY'
          from pathlib import Path
          from shutil import rmtree
          import sys

          staged_runner = Path(sys.argv[1])
          debug_bundles = sorted(staged_runner.rglob('*.dSYM'), key=lambda path: len(path.parts), reverse=True)
          for path in debug_bundles:
              if path.is_dir():
                  rmtree(path)
          PY
          cd "$RUNNER_TEMP/package"
          ipa="$RUNNER_TEMP/artifacts/XCTestControl-ios16-no-dsym.ipa"
          /usr/bin/zip -qry "$ipa" Payload
          python3 - "$ipa" <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          import sys

          with ZipFile(sys.argv[1]) as archive:
              invalid_entry = archive.testzip()
              if invalid_entry:
                  raise SystemExit(f'Corrupt archive entry: {invalid_entry}')
              names = archive.namelist()
              if not any(name.endswith('/XCTestControlUITests.xctest/XCTestControlUITests') for name in names):
                  raise SystemExit('Missing XCTest executable')
              if any(part.endswith('.dSYM') for name in names for part in PurePosixPath(name).parts):
                  raise SystemExit('The IPA contains a dSYM bundle')
          PY
      - name: Package the gesture fixture
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/derived/Build/Products/Debug-iphoneos/GestureFixture.app"
          test -f "$fixture/GestureFixture"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$fixture/Info.plist")" = com.touchsynthesis.diagnostics.gesturefixture
          mkdir -p "$RUNNER_TEMP/fixture/Payload"
          ditto "$fixture" "$RUNNER_TEMP/fixture/Payload/GestureFixture.app"
          cd "$RUNNER_TEMP/fixture"
          /usr/bin/zip -qry "$RUNNER_TEMP/artifacts/GestureFixture-ios16.ipa" Payload
          /usr/bin/unzip -tq "$RUNNER_TEMP/artifacts/GestureFixture-ios16.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: XCTestControl-ios16-no-dsym
          path: ${{ runner.temp }}/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 7
